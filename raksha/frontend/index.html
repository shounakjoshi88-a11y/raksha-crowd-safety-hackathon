<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raksha - Crowd + Her Safety</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>#map{height:420px}</style>
</head>
<body class="bg-slate-950 text-white">
<div class="max-w-6xl mx-auto p-4">
<h1 class="text-2xl font-bold">🛡️ Raksha - Crowd Safety + Security4Her</h1>
<p class="text-slate-400">Single dashboard for organizers + personal safety for attendees. Backend: <code>http://localhost:8000</code></p>
<div class="grid md:grid-cols-2 gap-4 mt-4">
<div class="bg-slate-900 p-4 rounded">
<h2 class="font-bold">1. Live Zone Risk</h2>
<div id="zones" class="mt-2 space-y-2"></div>
<button onclick="loadZones()" class="mt-3 bg-blue-600 px-3 py-2 rounded">Refresh Zones</button>
<input type="file" id="frame" accept="image/*" class="mt-3 block text-sm"/>
<button onclick="upload()" class="mt-2 bg-purple-600 px-3 py-2 rounded">Analyze CCTV Frame</button>
<div id="crowdRes" class="mt-2 text-sm"></div>
</div>
<div class="bg-slate-900 p-4 rounded">
<h2 class="font-bold text-pink-300">2. Security4Her - SOS</h2>
<button onclick="sendSOS()" class="bg-red-600 text-xl px-6 py-4 rounded-full w-full mt-2">🚨 SOS - TAP 3s</button>
<div class="mt-2 text-sm flex gap-2">
<input id="lat" value="19.076" class="text-black p-1 w-24"><input id="lon" value="72.8777" class="text-black p-1 w-24">
</div>
<div id="sosRes" class="mt-2 text-sm"></div>
<h3 class="mt-4 font-bold">Report harassment / unsafe spot</h3>
<input id="repDesc" placeholder="e.g. being followed near Exit 2" class="text-black p-2 w-full mt-1">
<button onclick="sendReport()" class="mt-2 bg-pink-600 px-3 py-2 rounded">Submit Report (AI triage)</button>
<div id="repRes" class="mt-2 text-sm"></div>
</div>
</div>
<div class="bg-slate-900 p-4 rounded mt-4"><h2 class="font-bold">3. Map + Alerts</h2><div id="map" class="rounded mt-2"></div><div id="alerts" class="mt-2 text-sm"></div></div>
</div>
<script>
const API="http://localhost:8000";
let map=L.map('map').setView([19.076,72.8777],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
async function loadZones(){
 const r=await fetch(API+"/zones").then(r=>r.json());
 document.getElementById('zones').innerHTML=r.zones.map(z=>`<div class="p-2 rounded ${z.risk=='red'?'bg-red-900':z.risk=='yellow'?'bg-yellow-900':'bg-green-900'}">${z.name}: ${z.density} people - ${z.risk.toUpperCase()}</div>`).join('');
 const a=await fetch(API+"/alerts").then(r=>r.json());
 document.getElementById('alerts').innerText=JSON.stringify(a).slice(0,800);
}
async function upload(){
 const f=document.getElementById('frame').files[0]; if(!f) return alert('pick image');
 const fd=new FormData(); fd.append('file',f);
 const r=await fetch(API+"/analyze-crowd",{method:'POST',body:fd}).then(r=>r.json());
 document.getElementById('crowdRes').innerText=`Count: ${r.count} Risk: ${r.risk} ${r.alert?r.alert.msg:''}`;
}
async function sendSOS(){
 const lat=parseFloat(document.getElementById('lat').value), lon=parseFloat(document.getElementById('lon').value);
 navigator.geolocation?.getCurrentPosition(p=>{document.getElementById('lat').value=p.coords.latitude;document.getElementById('lon').value=p.coords.longitude;});
 const r=await fetch(API+"/sos",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:'demo-her-01',lat,lon})}).then(r=>r.json());
 document.getElementById('sosRes').innerText=r.msg;
}
async function sendReport(){
 const d=document.getElementById('repDesc').value;
 const r=await fetch(API+"/report",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:'demo-her-01',lat:19.076,lon:72.8777,category:'harassment',description:d})}).then(r=>r.json());
 document.getElementById('repRes').innerText='AI triage: '+r.triage;
}
loadZones(); setInterval(loadZones,8000);
</script>
</body></html>
